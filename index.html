<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ちーちゃんに会えるまで</title>

<style>

/* =========================
   ページ全体
========================= */
body{
    margin:0;
    font-family:"Hiragino Sans","Yu Gothic",sans-serif;

    background:linear-gradient(135deg,#ffd6e7,#ffeef5);

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;

    overflow:hidden;

    transition:background 1s ease;
}


/* =========================
   カード
========================= */
.card{
    width:85%;
    max-width:420px;

    background:white;

    border-radius:25px;

    padding:35px 25px;

    text-align:center;

    box-shadow:0 10px 30px rgba(0,0,0,.15);

    position:relative;
    z-index:5;
}


/* =========================
   ハート
========================= */
.heart{
    font-size:45px;
    animation:beat 1s infinite;
    margin-bottom:10px;
}


/* =========================
   画像
========================= */
.micky{
    width:160px;
    max-width:60%;
    height:auto;

    margin:5px auto 20px;

    display:block;

    animation:float 3s ease-in-out infinite;
}

/* =========================
   大量に降るハート
========================= */

.rain-heart{
    position:fixed;
    top:-50px;

    font-size:25px;

    pointer-events:none;

    z-index:300;

    animation:heartRain linear forwards;
}


@keyframes heartRain{

    0%{
        transform:
            translateY(-50px)
            rotate(0deg);

        opacity:1;
    }

    100%{
        transform:
            translateY(110vh)
            rotate(360deg);

        opacity:0.9;
    }

}


/* =========================
   タイトル
========================= */
h1{
    color:#ff5c93;
    margin-top:5px;
    margin-bottom:10px;
    font-size:1.7rem;
}


/* =========================
   サブタイトル
========================= */
.subtitle{
    color:#666;
    margin-bottom:25px;
}


/* =========================
   カウントダウン
========================= */
#countdown{
    font-size:2rem;
    font-weight:bold;
    color:#ff3d7f;
    line-height:1.6;
}


/* =========================
   メッセージ
========================= */
.message{
    margin-top:30px;
    color:#555;
    line-height:1.8;
}


/* =========================
   終了後メッセージ
========================= */
.final-message{

    font-size:1.8rem;

    font-weight:bold;

    color:#ff3d7f;

    line-height:1.7;

    animation:messageAppear 1s ease forwards;
}


/* =========================
   画面フラッシュ
========================= */
.flash{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:white;

    opacity:0;

    pointer-events:none;

    z-index:100;

}


/* フラッシュ発動 */
.flash.active{
    animation:flashAnimation 0.8s ease;
}


/* =========================
   紙吹雪
========================= */
.confetti{

    position:fixed;

    top:-20px;

    width:12px;
    height:12px;

    z-index:50;

    pointer-events:none;

    animation:fall linear forwards;
}


/* ハート型紙吹雪 */
.confetti.heart-confetti{

    width:auto;
    height:auto;

    font-size:20px;

    background:none !important;
}


/* =========================
   アニメーション
========================= */


/* ハート */
@keyframes beat{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.15);
    }

}


/* 通常時のふわふわ */
@keyframes float{

    0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-12px);
    }

    100%{
        transform:translateY(0);
    }

}


/* 終了時 micky ポンッ */
.micky.celebrate{

    animation:pop 1.2s ease forwards;

}


@keyframes pop{

    0%{
        transform:scale(1);
    }

    35%{
        transform:scale(1.45);
    }

    60%{
        transform:scale(0.95);
    }

    80%{
        transform:scale(1.15);
    }

    100%{
        transform:scale(1.05);
    }

}


/* メッセージ出現 */
@keyframes messageAppear{

    0%{
        opacity:0;
        transform:translateY(20px) scale(0.9);
    }

    100%{
        opacity:1;
        transform:translateY(0) scale(1);
    }

}


/* 画面フラッシュ */
@keyframes flashAnimation{

    0%{
        opacity:0;
    }

    30%{
        opacity:0.95;
    }

    100%{
        opacity:0;
    }

}


/* 紙吹雪が落ちる */
@keyframes fall{

    0%{
        transform:
            translateY(-20px)
            rotate(0deg);

        opacity:1;
    }

    100%{
        transform:
            translateY(110vh)
            rotate(720deg);

        opacity:0.8;
    }

}


/* 終了後の背景 */
body.celebration{

    background:
        linear-gradient(
            135deg,
            #ffd1e4,
            #fff0f7,
            #dcecff
        );

}


/* スマホ */
@media(max-width:500px){

    #countdown{
        font-size:1.7rem;
    }

    .final-message{
        font-size:1.5rem;
    }

    h1{
        font-size:1.5rem;
    }

    .micky{
        width:140px;
    }

}

</style>
</head>


<body>


<!-- =========================
     画面フラッシュ
========================= -->
<div id="flash" class="flash"></div>


<!-- =========================
     メインカード
========================= -->
<div class="card">


    <div class="heart">
        💙
    </div>


    <h1>
        ちーちゃんに会えるまで
    </h1>


    <p class="subtitle" id="subtitle">
        早く会いたい!
    </p>


    <!-- GitHubにアップロードした画像 -->
    <img
        src="micky.png"
        class="micky"
        id="micky"
        alt="イラスト"
    >


    <!-- カウントダウン -->
    <div id="countdown"></div>


    <p class="message" id="normalMessage">

        毎日頑張ってるちーちゃんへ。<br>

        あと少し、一緒に頑張ろうね

    </p>


</div>



<script>

/* ==============================
   会える日時
============================== */

const meetingDate =
    new Date("2026-09-11T17:00:00");



/* ==============================
   使用する要素
============================== */

const countdown =
    document.getElementById("countdown");

const micky =
    document.getElementById("micky");

const flash =
    document.getElementById("flash");

const normalMessage =
    document.getElementById("normalMessage");

const subtitle =
    document.getElementById("subtitle");



/* ==============================
   演出が一度だけ発動するため
============================== */

let celebrationStarted = false;



/* ==============================
   カウントダウン
============================== */

function updateCountdown(){

    const now = new Date();

    const diff = meetingDate - now;


    /* =========================
       カウントダウン終了
    ========================= */

    if(diff <= 0){

        startCelebration();

        return;
    }


    const days =
        Math.floor(
            diff / (1000*60*60*24)
        );


    const hours =
        Math.floor(
            (diff%(1000*60*60*24))
            /(1000*60*60)
        );


    const minutes =
        Math.floor(
            (diff%(1000*60*60))
            /(1000*60)
        );


    const seconds =
        Math.floor(
            (diff%(1000*60))
            /1000
        );


    countdown.innerHTML =

        `${days}日<br>
        ${hours}時間 ${minutes}分 ${seconds}秒`;

}



/* ==============================
   お祝い演出
============================== */

function startCelebration(){


    /* 一度しか実行しない */
    if(celebrationStarted){
        return;
    }


    celebrationStarted = true;


    /* =========================
       ① 画面が一瞬光る
    ========================= */

    flash.classList.add("active");


    /* =========================
       背景変更
    ========================= */

    document.body.classList.add(
        "celebration"
    );


    /* =========================
       ② 紙吹雪
    ========================= */

    setTimeout(()=>{

        createConfetti();

    },300);



    /* =========================
       ③ micky ポンッ
    ========================= */

    setTimeout(()=>{

        micky.classList.add(
            "celebrate"
        );

    },700);



    /* =========================
       ④ メッセージ変更
    ========================= */

    setTimeout(()=>{


        subtitle.innerHTML =
            "やっと会えるね！";


        countdown.innerHTML =

        `<div class="final-message">

            🎉 ついに今日だよ！ 🎉
            <br>

            ちーちゃんに会える！
            <br>

            愛してる 💙

        </div>`;


        normalMessage.innerHTML =

            "今日まで本当にお疲れさま。<br>" +
            "いっぱい楽しもうね 💙";


    },1200);

}



/* ==============================
   紙吹雪を作る
============================== */

function createConfetti(){


    const colors = [

        "#ff5c93",
        "#ff9abb",
        "#6aa9ff",
        "#ffd54f",
        "#a78bfa",
        "#7dd3fc"

    ];


    /* 紙吹雪の数 */
    for(let i=0;i<100;i++){


        const confetti =
            document.createElement("div");


        confetti.classList.add(
            "confetti"
        );


        /* ランダムでハートにする */
        const isHeart =
            Math.random() < 0.25;


        if(isHeart){

            confetti.classList.add(
                "heart-confetti"
            );


            confetti.innerHTML =

                Math.random() > 0.5
                ? "💙"
                : "💗";

        }

        else{

            confetti.style.backgroundColor =

                colors[
                    Math.floor(
                        Math.random()
                        *colors.length
                    )
                ];

        }


        /* 横位置 */
        confetti.style.left =

            Math.random()*100 + "vw";


        /* 落ちる速度 */
        confetti.style.animationDuration =

            (3 + Math.random()*3)
            + "s";


        /* 少しずつ開始時間をずらす */
        confetti.style.animationDelay =

            Math.random()*1.5
            + "s";


        /* サイズ */
        const size =
            7 + Math.random()*10;


        if(!isHeart){

            confetti.style.width =
                size+"px";

            confetti.style.height =
                size+"px";

        }


        document.body.appendChild(
            confetti
        );


        /* 終わった紙吹雪を削除 */
        setTimeout(()=>{

            confetti.remove();

        },7000);

    }

}



/* ==============================
   最初の実行
============================== */

updateCountdown();


/* ==============================
   1秒ごとに更新
============================== */

const timer =
    setInterval(()=>{

        updateCountdown();


        /* 終了したらタイマー停止 */
        if(celebrationStarted){

            clearInterval(timer);

        }

    },1000);


/* ==============================
   好きボタン
============================== */

const likeButton =
    document.getElementById("likeButton");

const likeCount =
    document.getElementById("likeCount");

let likes = 0;


likeButton.addEventListener(
    "click",
    function(){

        /* 好きの数を増やす */
        likes++;

        likeCount.textContent = likes;


        /* ボタンの位置を取得 */
        const rect =
            likeButton.getBoundingClientRect();


        /* ハートを作る */
        const heart =
            document.createElement("div");

        heart.classList.add(
            "flying-heart"
        );

        heart.textContent =
            Math.random() > 0.5
            ? "💙"
            : "💗";


        /* ボタンの真上から出す */
        heart.style.left =
            rect.left +
            rect.width / 2 +
            "px";

        heart.style.top =
            rect.top +
            "px";


        document.body.appendChild(
            heart
        );


        /* アニメーション終了後削除 */
        setTimeout(()=>{

            heart.remove();

        },1300);

    }
);


</script>


</body>

</html>
